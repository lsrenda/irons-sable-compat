plugins {
    id 'net.neoforged.moddev' version '2.0.+'
}

base {
    archivesName = project.mod_id
    version = project.mod_version
}

neoForge {
    version = project.neoforge_version
    mods {
        ironssablecompat {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        // forRepositories(fg.repository) // Uncomment when using ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://www.cursemaven.com"
    }
}

dependencies {

//    implementation files("libs/sable-neoforge-1.21.1-1.2.2.jar")

    // Sable Companion - JiJ'd so it ships inside your mod
    jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:[1.6.0,1.6.1)")) {
        version { prefer project.sable_companion_version }
    }

    // Iron's Spells - implementation so it loads at runtime during dev
    implementation "maven.modrinth:irons-spells-n-spellbooks:1.21.1-${project.irons_spellbooks_version}"
    implementation "maven.modrinth:sable:${project.sable_version}+mc1.21.1"
}

processResources {
    def replaceProperties = [
        mod_version: project.mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
